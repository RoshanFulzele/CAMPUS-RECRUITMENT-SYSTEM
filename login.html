<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In | CampusRecruit</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="mesh-bg auth-page">
  <div class="auth-card glass animate-in">
    <div class="auth-header">
      <div class="siri-orb sm"></div>
      <h1>Welcome back</h1>
      <p>Sign in to your placement hub</p>
    </div>

    <div id="login-alert"></div>

    <form id="login-form">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" required placeholder="student@demo.com" />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" required placeholder="demo123" />
      </div>
      <button type="submit" class="btn btn-primary btn-block">Sign in</button>
    </form>

    <p style="margin:1.5rem 0 0.75rem;font-size:0.75rem;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;color:var(--ink-soft)">Quick demo</p>
    <div style="display:grid;gap:0.5rem">
      <button type="button" class="btn btn-glass btn-sm btn-block" data-demo-login="student@demo.com">🎓 Priya — Student</button>
      <button type="button" class="btn btn-glass btn-sm btn-block" data-demo-login="arjun@demo.com">🎓 Arjun — Student</button>
      <button type="button" class="btn btn-glass btn-sm btn-block" data-demo-login="hr@techcorp.demo">🏢 TechCorp</button>
      <button type="button" class="btn btn-glass btn-sm btn-block" data-demo-login="campus@razorpay.demo">🏢 Razorpay</button>
      <button type="button" class="btn btn-glass btn-sm btn-block" data-demo-login="tpo@college.demo">📊 TPO Admin</button>
    </div>

    <p class="text-center text-muted mt-4">
      <a href="register.html">Create account</a> · <a href="index.html">Home</a>
    </p>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script>
    seedDemoData();
    redirectIfLoggedIn();

    document.getElementById("login-form").addEventListener("submit", function (e) {
      e.preventDefault();
      const result = loginUser(
        document.getElementById("email").value.trim(),
        document.getElementById("password").value
      );
      if (result.error) {
        showAlert(document.getElementById("login-alert"), result.error, "error");
        return;
      }
      window.location.href = getDashboardPath(result.user.user_role);
    });

    document.querySelectorAll("[data-demo-login]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        const result = quickLogin(btn.dataset.demoLogin);
        if (result.error) {
          showAlert(document.getElementById("login-alert"), result.error, "error");
          return;
        }
        window.location.href = getDashboardPath(result.user.user_role);
      });
    });
  </script>
</body>
</html>
